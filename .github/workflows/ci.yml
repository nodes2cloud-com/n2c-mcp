name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` says >=18, so every supported major is tested.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  registry-manifest:
    name: server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The npm that release.yml publishes with.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: npm publishes the manifest unchanged
        # `npm publish` silently drops fields it considers invalid (it removed
        # the `bin` once, which would have shipped a package with no command).
        # Fail on any auto-correction, and check the packed bin really exists.
        run: |
          npm publish --dry-run 2>&1 | tee publish.log
          if grep -q "auto-corrected" publish.log; then
            echo "::error::npm would rewrite package.json on publish; run npm pkg fix"
            exit 1
          fi
          npm pack --silent
          tar -xzf n2c-mcp-*.tgz -O package/package.json \
            | node -e 'const p=JSON.parse(require("fs").readFileSync(0)); if(!p.bin||!p.bin["n2c-mcp"]){console.error("packed package.json has no n2c-mcp bin");process.exit(1)}'
          tar -tzf n2c-mcp-*.tgz | grep -qx "package/dist/index.js"
      - name: Versions agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          for v in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            [ "$v" = "$pkg" ] || { echo "server.json version $v != package.json $pkg"; exit 1; }
          done
          [ "$(jq -r .name server.json)" = "$(node -p "require('./package.json').mcpName")" ] \
            || { echo "server.json name != package.json mcpName"; exit 1; }
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Validate against the registry
        run: ./mcp-publisher validate
